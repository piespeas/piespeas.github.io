<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcousticVoid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
  :root {
    --bg: #000;
    --text: #fff;
    --text-2: #a1a1aa;
    --text-3: #52525b;
    --line: #1c1c1f;
    --line-2: #2e2e35;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 96px 24px 96px; }

  h1 { font-size: clamp(2.4rem, 8vw, 3.5rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .role { margin-top: 10px; color: var(--text-2); font-weight: 500; }
  .facts { margin-top: 6px; color: var(--text-3); }

  h2 { font-size: 1rem; font-weight: 600; margin: 64px 0 16px; }

  .links { display: grid; gap: 8px; }
  .link {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: inherit; text-decoration: none; background: none;
    font: inherit; text-align: left; width: 100%; cursor: pointer;
    transition: border-color .15s;
  }
  .link:hover, .link:focus-visible { border-color: var(--line-2); outline: none; }
  .link:focus-visible { border-color: var(--text-2); }
  .link b { font-weight: 600; }
  .link span { color: var(--text-3); font-size: .85rem; }

  .search {
    width: 100%; margin-bottom: 16px;
    background: none; color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 14px; font: inherit; outline: none;
  }
  .search::placeholder { color: var(--text-3); }
  .search:focus { border-color: var(--line-2); }

  .note { color: var(--text-3); font-size: .85rem; margin-bottom: 16px; }
  .exp { display: flex; flex-wrap: wrap; gap: 8px; }
  .exp li {
    list-style: none;
    border: 1px solid var(--line); border-radius: 100px;
    padding: 5px 14px; color: var(--text-2); font-size: .85rem;
  }

  #music-btn {
    position: fixed; top: 16px; right: 16px;
    width: 38px; height: 38px;
    background: none; color: var(--text-2);
    border: 1px solid var(--line-2); border-radius: 10px;
    font-size: 15px; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  #music-btn:hover, #music-btn:focus-visible { color: var(--text); border-color: var(--text-2); outline: none; }

  ::selection { background: #2a2a2a; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<audio id="music" src="song.mp3" loop preload="auto"></audio>
<button id="music-btn" aria-label="Play or pause music">&#9654;</button>

<main>
  <header>
    <h1>AcousticVoid</h1>
    <p class="role">Screensharer</p>
    <p class="facts">17 y/o, England, UK, English</p>
  </header>

  <section>
    <h2>Links</h2>
    <div class="links" id="links"></div>
  </section>

  <section>
    <h2>Experience - SSing + Moderation</h2>
    <p class="note">Partial record, less than 10% of total experience. Active and past.</p>
    <input class="search" id="search" type="search" placeholder="Search communities" aria-label="Search communities">
    <ul class="exp" id="exp"></ul>
  </section>
</main>

<script>
const links = [
  { name: "Acoustic SS Server", note: "Discord server", url: "https://discord.gg/w49VG9T8BM" },
  { name: "MC Screenshare Community", note: "Discord server", url: "https://discord.gg/dpam8rEJZy" },
  { name: "Discord", note: "piespeas", copy: "piespeas" }
];

const experience = [
  "PvPChamps / PvPHQ","Hoplite","Minecraft Screenshare Community","RedLotus Forensics","Ocean Anticheat",
  "Detect.ac","FadedMC","PVP Tiers Network","Crystal TL","Mace TL","Axe TL","Sword TL",
  "SMP TL","UHC TL","Nethpot TL","DiaPot TL","Solitary TL","CZ/SK PVP Community",
  "Xylon","UKFFA","WestFFA","CartPrac","Indian Tiers","Stoneworks","France Tiers",
  "OCE TL","Vexoria Network","Ranked Bedwars","Bridge Scrims","FunnieWars","ColdPvP",
  "Purple Prison","Combat TL","Blitz TL","PVP TL","EZ TL","Ryzen MC"
];

const linksEl = document.getElementById('links');
links.forEach(l => {
  const el = document.createElement(l.copy ? 'button' : 'a');
  el.className = 'link';
  if (!l.copy) { el.href = l.url; el.target = '_blank'; el.rel = 'noopener'; }
  el.innerHTML = '<b></b><span></span>';
  el.querySelector('b').textContent = l.name;
  const note = el.querySelector('span');
  note.textContent = l.note || l.copy;
  if (l.copy) {
    el.addEventListener('click', () => {
      navigator.clipboard.writeText(l.copy).then(() => {
        note.textContent = 'Copied';
        setTimeout(() => note.textContent = l.copy, 1800);
      });
    });
  }
  linksEl.appendChild(el);
});

const expEl = document.getElementById('exp');
function renderExp(q = '') {
  const term = q.toLowerCase().trim();
  const list = term ? experience.filter(e => e.toLowerCase().includes(term)) : experience;
  expEl.innerHTML = '';
  list.forEach(n => {
    const li = document.createElement('li');
    li.textContent = n;
    expEl.appendChild(li);
  });
}
document.getElementById('search').addEventListener('input', e => renderExp(e.target.value));
renderExp();

const music = document.getElementById('music');
const btn = document.getElementById('music-btn');
function sync() { btn.innerHTML = music.paused ? '&#9654;' : '&#10074;&#10074;'; }
btn.addEventListener('click', e => {
  e.stopPropagation();
  if (music.paused) music.play().catch(() => {}); else music.pause();
});
music.addEventListener('play', sync);
music.addEventListener('pause', sync);
// browsers block autoplay, so start on the first click anywhere
document.addEventListener('click', () => { if (music.paused) music.play().catch(() => {}); }, { once: true });
</script>
</body>
</html>
